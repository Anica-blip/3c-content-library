name = "dropin-chat"
main = "index.js"
compatibility_date = "2024-01-01"
preview_urls = false

[[kv_namespaces]]
binding = "CHAT_KV"
id = "e8df3751ad8b4cdda353683b97e08f09"

[[kv_namespaces]]
binding = "REVIEWS_KV"
id = "1185fa64f2c14b508278cc06b24eb0af"

[[kv_namespaces]]
binding = "BUILDKIT_KV"
id = "214959dc21244082b3e80493a847ffd2"

[[kv_namespaces]]
binding = "SHARE_CACHE_KV"
id = "09c09aeec9b7423ca162e57c2af8cd36"

# Added so this Worker can read thumbnail images directly from R2 (bucket
# name confirmed from the R2 dashboard) rather than relying on a fetch to
# api.3c-public-library.org, which non-browser requests get blocked on.
[[r2_buckets]]
binding = "THUMBNAILS_BUCKET"
bucket_name = "3c-library-files"

[triggers]
crons = ["0 14 * * *"]
