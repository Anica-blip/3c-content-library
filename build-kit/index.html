<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3C Build Kit</title>
<meta name="description" content="Every 3C link in one place — subscribe, referrals, tools and credits.">
<link rel="icon" type="image/png" href="../favicon1.png">
<style>
    :root {
        --bg-primary: #0a0416;
        --bg-chat: rgba(26, 26, 26, 0.95);
        --purple-light: #9b59b6;
        --purple-medium: #8e44ad;
        --accent: #7b3fe4;
        --teal: #00d4c8;
        --text-primary: #ffffff;
        --text-dim: rgba(240, 234, 248, 0.55);
        --border: rgba(155, 89, 182, 0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; min-height: 100%;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    .header {
        background: linear-gradient(135deg, #2d1b69 0%, #4a2c8f 50%, #3b1f7a 100%);
        padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid var(--border); box-shadow: 0 2px 20px rgba(74, 44, 143, 0.4);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left img { height: 36px; width: 36px; border-radius: 50%; object-fit: cover; background: white; padding: 3px; }
    .header-left h1 { font-size: 18px; font-weight: 800; color: #c084fc; text-shadow: 0 0 16px rgba(192, 132, 252, 0.55); }
    .icon-btn {
        background: rgba(155, 89, 182, 0.15); border: 1px solid rgba(155, 89, 182, 0.35); color: #c084fc;
        width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.2s; text-decoration: none;
    }
    .icon-btn:hover { background: rgba(155, 89, 182, 0.3); border-color: rgba(155,89,182,0.6); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .main { max-width: 560px; margin: 0 auto; padding: 40px 24px 60px; }
    .intro { text-align: center; margin-bottom: 40px; }
    .intro .tagline { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; }
    .intro p { font-size: 13px; color: var(--text-dim); }

    /* The thread — a quiet connecting line down the page, same idea as
       the reference design, recolored to match everything else here */
    .thread { position: relative; padding-left: 26px; }
    .thread::before {
        content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px;
        background: linear-gradient(180deg, transparent, var(--accent) 8%, var(--teal) 92%, transparent);
        opacity: 0.4;
    }
    .bk-section { margin-bottom: 32px; position: relative; }
    .bk-section::before {
        content: ''; position: absolute; left: -25px; top: 4px;
        width: 9px; height: 9px; background: var(--teal); border-radius: 2px; transform: rotate(45deg);
    }
    .bk-section h2 {
        font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
        color: #c084fc; margin-bottom: 12px;
    }
    .bk-entry {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .bk-entry:last-child { border-bottom: none; }
    .bk-entry .bk-title { font-size: 14px; color: var(--text-primary); }
    .bk-entry .bk-link-btn {
        background: rgba(0, 212, 200, 0.1); border: 1px solid rgba(0, 212, 200, 0.35); color: var(--teal);
        width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; text-decoration: none; transition: all 0.2s;
    }
    .bk-entry .bk-link-btn:hover { background: rgba(0, 212, 200, 0.22); transform: translateY(-1px); }
    .bk-entry .bk-link-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .bk-empty { font-size: 12px; color: var(--text-dim); font-style: italic; }

    .legal-footer {
        margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);
        text-align: center;
    }
    .legal-footer a {
        display: inline-flex; align-items: center; gap: 8px; color: #c084fc; text-decoration: none;
        font-size: 13px; font-weight: 600; padding: 10px 18px; border: 1px solid rgba(192,132,252,0.35);
        border-radius: 10px; background: rgba(192,132,252,0.06); transition: all 0.2s;
    }
    .legal-footer a:hover { background: rgba(192,132,252,0.14); }

    #watermark {
        text-align: center; padding: 16px; font-size: 10px; color: rgba(155, 89, 182, 0.6);
        border-top: 1px solid rgba(155, 89, 182, 0.1); margin-top: 30px;
    }
    #watermark a { color: rgba(192, 132, 252, 0.7); text-decoration: none; }
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <img src="../3C Thread To Success logo.png" alt="3C Logo">
        <h1>3C Build Kit</h1>
    </div>
    <button class="icon-btn" id="exitBtn" title="Exit">
        <svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M15 16l5-5-5-5M20 11H9"/></svg>
    </button>
</div>

<div class="main">
    <div class="intro">
        <div class="tagline">Think it. Do it. Own it.</div>
        <p>Every 3C link in one place — subscribe, referrals, tools and credits.</p>
    </div>

    <div class="thread" id="sectionsContainer"></div>

    <div style="text-align: center; margin-top: 30px;">
        <a href="https://anica-blip.github.io/3c-links/" target="_blank" rel="noopener" style="display: inline-block; background: transparent; border: 1px solid rgba(155, 89, 182, 0.15); color: #6a5a80; text-decoration: none; padding: 5px 12px; border-radius: 8px; font-size: 10px; transition: all 0.2s;" onmouseover="this.style.color='#9b7bb0'; this.style.borderColor='rgba(155,89,182,0.3)'" onmouseout="this.style.color='#6a5a80'; this.style.borderColor='rgba(155,89,182,0.15)'">
            🔗 3C Links
        </a>
    </div>

    <div class="legal-footer">
        <a href="https://github.com/Anica-blip/3c-brand-protection" target="_blank" rel="noopener">
            ⚖️ Content ownership, AI tools &amp; legal record
        </a>
    </div>
</div>

<div id="watermark">
    Designed &amp; built with ❤️ by <a href="https://www.anthropic.com" target="_blank" rel="noopener">Claude</a> (Anthropic) × Chef Anica · 3C Thread To Success Cooking Lab 🧪👨‍🍳
</div>

<script>
const WORKER_URL = 'https://dropin-chat.3c-innertherapy.workers.dev';

const SECTION_LABELS = {
    subscribe: 'Subscribe',
    referrals: 'Referrals',
    tools: 'Tools',
    credits: 'Credits',
    brand_tools: '3C Brand Tools',
};
const SECTION_ORDER = ['subscribe', 'referrals', 'tools', 'credits', 'brand_tools'];

document.getElementById('exitBtn').onclick = () => {
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'vault-close-modal' }, '*');
        return;
    }
    if (document.referrer) { window.location.href = document.referrer; }
    else { window.location.href = '../vault/vault.html'; }
};

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function loadEntries() {
    const container = document.getElementById('sectionsContainer');
    try {
        const res = await fetch(`${WORKER_URL}/api/buildkit/entries`);
        const data = await res.json();
        const entries = data.entries || [];

        container.innerHTML = SECTION_ORDER.map(section => {
            const sectionEntries = entries.filter(e => e.section === section);
            const rows = sectionEntries.length > 0
                ? sectionEntries.map(e => `
                    <div class="bk-entry">
                        <span class="bk-title">${escapeHtml(e.title)}</span>
                        <a class="bk-link-btn" href="${e.url}" target="_blank" rel="noopener" title="Open link">
                            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
                        </a>
                    </div>
                  `).join('')
                : `<div class="bk-empty">Nothing here yet.</div>`;
            return `
                <div class="bk-section">
                    <h2>${SECTION_LABELS[section]}</h2>
                    ${rows}
                </div>
            `;
        }).join('');
    } catch (e) {
        container.innerHTML = '<p style="color:var(--text-dim); text-align:center;">Could not load links right now. Please try again shortly.</p>';
    }
}

loadEntries();
</script>
</body>
</html>
