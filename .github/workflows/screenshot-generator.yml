name: Generate Screenshots for External URLs

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read # Read repository contents
  actions: write # Upload artifacts

jobs:
  generate-screenshots:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install puppeteer @supabase/supabase-js aws-sdk
      
      - name: Verify environment variables
        run: |
          echo "Checking environment variables..."
          echo "SUPABASE_URL: ${{ vars.SUPABASE_URL != '' && '✅ Set' || '❌ Missing' }}"
          echo "SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY != '' && '✅ Set' || '❌ Missing' }}"
          echo "R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID != '' && '✅ Set' || '❌ Missing' }}"
          echo "R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' && '✅ Set' || '❌ Missing' }}"
          echo "R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' && '✅ Set' || '❌ Missing' }}"
      
      - name: Generate screenshots
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: '3c-library-files'
        run: node .github/scripts/generate-screenshots.js
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-logs-${{ github.run_id }}
          path: screenshot-logs.txt
          retention-days: 7
      
      - name: Notify on failure
        if: failure()
        
        run: |
          echo "❌ Screenshot generation failed!"
          echo "📋 Check the logs artifact for details"
          cat screenshot-logs.txt || echo "No log file found"
